<div id="staff-status-{{ staff.id }}" class="flex items-center gap-2">
    {% if error %}
        <div class="text-[11px] text-rose-600 font-bold bg-rose-50 px-2 py-1 rounded border border-rose-200">
            {{ error }}
        </div>
    {% endif %}

    {% if staff.is_active %}
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
            Active
        </span>
        <button
            hx-post="{{ url_for('admin.staff_toggle_status', user_id=staff.id) }}"
            hx-target="#staff-status-{{ staff.id }}"
            hx-swap="outerHTML"
            class="min-h-[44px] px-3 py-1.5 text-xs font-semibold rounded-lg text-rose-600 hover:bg-rose-50 border border-rose-200 transition flex items-center justify-center">
            Deactivate
        </button>
    {% else %}
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-500 border border-slate-200">
            <span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>
            Inactive
        </span>
        <button
            hx-post="{{ url_for('admin.staff_toggle_status', user_id=staff.id) }}"
            hx-target="#staff-status-{{ staff.id }}"
            hx-swap="outerHTML"
            class="min-h-[44px] px-3 py-1.5 text-xs font-semibold rounded-lg text-emerald-600 hover:bg-emerald-50 border border-emerald-200 transition flex items-center justify-center">
            Activate
        </button>
    {% endif %}
</div>
